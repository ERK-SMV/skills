apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marp-ingress
  namespace: ai-tools
  labels:
    app: marp-server
    component: presentation
  annotations:
    # Use appropriate annotations for your ingress controller
    # For Nginx Ingress:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # For Traefik Ingress:
    # traefik.ingress.kubernetes.io/router.entrypoints: web
    # For OVH (common in your setup):
    # kubernetes.io/ingress.class: "ovh"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx  # Change to your ingress class (e.g., "ovh", "traefik")
  rules:
  - host: marp.ai-tools.svc.cluster.local  # Internal DNS - change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: marp-service
            port:
              number: 80
  # Uncomment for external access with TLS:
  # tls:
  # - hosts:
  #   - marp.your-domain.com
  #   secretName: marp-tls
