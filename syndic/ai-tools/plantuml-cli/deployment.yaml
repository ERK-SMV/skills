apiVersion: apps/v1
kind: Deployment
metadata:
  name: plantuml-server
  namespace: ai-tools
  labels:
    app: plantuml-server
    component: diagramming
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plantuml-server
  template:
    metadata:
      labels:
        app: plantuml-server
        component: diagramming
    spec:
      containers:
      - name: plantuml
        image: plantuml/plantuml-server:jetty
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
      nodeSelector:
        kubernetes.io/os: linux
