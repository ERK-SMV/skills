apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-n8n
  namespace: ai-tools
spec:
  serviceName: postgres-n8n
  replicas: 1
  selector:
    matchLabels:
      app: postgres-n8n
  template:
    metadata:
      labels:
        app: postgres-n8n
    spec:
      containers:
      - name: postgres-n8n
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: n8n
        - name: POSTGRES_USER
          value: n8n
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-db-password
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-n8n-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "n8n"]
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "n8n"]
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-n8n-data
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-n8n
  namespace: ai-tools
spec:
  clusterIP: None
  selector:
    app: postgres-n8n
  ports:
    - protocol: TCP
      port: 5432
