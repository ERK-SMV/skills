apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-n8n
  namespace: ai-tools
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-n8n
  template:
    metadata:
      labels:
        app: redis-n8n
    spec:
      containers:
      - name: redis-n8n
        image: redis:7-alpine
        args: ["--save", "", "--appendonly", "no"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-n8n
  namespace: ai-tools
spec:
  selector:
    app: redis-n8n
  ports:
    - protocol: TCP
      port: 6379
