apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-mcp-server
  labels:
    app: odoo-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: odoo-mcp-server
  template:
    metadata:
      labels:
        app: odoo-mcp-server
    spec:
      containers:
      - name: odoo-mcp-server
        image: your-registry/odoo-mcp-server:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: odoo-mcp-config
        - secretRef:
            name: odoo-mcp-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          failureThreshold: 30
          periodSeconds: 10
